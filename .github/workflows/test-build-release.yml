name: Build and Release
run-name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  check-pr-author:
    name: Check merged PR author
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Check whether the pushed commit belongs to a Dependabot PR
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          is_dependabot=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq 'any(.[]; .user.login == "dependabot[bot]")')
          if [[ "$is_dependabot" == "true" ]]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  build-job:
    name: Build panzer-plugin
    needs: check-pr-author
    if: needs.check-pr-author.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Go version
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - name: Install versioning tool
        run: go install github.com/xchapter7x/versioning@latest
      - name: Determine Version
        id: determine_version
        run: |
          echo VERSION=$(~/go/bin/versioning bump_patch) >> ${GITHUB_ENV}
      - name: Build panzer-plugin
        env:
          COMMIT: ${{ github.sha }}
          VERSION: ${{ env.VERSION }}
        run: .github/scripts/build.sh
      - name: upload panzer-plugin
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  release_job:
    name: Release panzer-plugin
    runs-on: ubuntu-latest
    needs: build-job
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install versioning tool
        run: go install github.com/xchapter7x/versioning@latest
      - name: Determine Version
        id: determine_version
        run: |
          echo VERSION=$(~/go/bin/versioning bump_patch) >> ${GITHUB_ENV}
      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Create Release using gh
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: "Release ${{ env.VERSION }}"
          files: dist/*
          tag_name: ${{ env.VERSION }}
